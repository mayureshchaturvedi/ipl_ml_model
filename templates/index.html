<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("{{ url_for('static', filename='background.jpg') }}") center center / cover no-repeat fixed;
            overflow-x: hidden;
            color: #333;
            position: relative;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(15, 16, 36, 0.45);
            pointer-events: none;
            z-index: -1;
        }
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 1s ease-in;
        }
        #loading-screen img {
            width: 200px;
            height: auto;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .progress-bar {
            width: 300px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #764ba2, #667eea);
            width: 0%;
            animation: load 3s ease-in-out forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 10px 20px;
            z-index: 999;
            display: none;
            animation: slideDown 0.5s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
        .navbar img {
            height: 50px;
            width: auto;
            animation: floatLogo 2.4s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-6px) rotate(4deg) scale(1.02); }
            50% { transform: translateY(0) rotate(-4deg) scale(1); }
            75% { transform: translateY(-4px) rotate(2deg) scale(1.01); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        /* Main Content */
        .main-content {
            display: none;
            padding-top: 80px;
            min-height: calc(100vh - 100px);
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-layout {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px 20px;
            max-width: 1080px;
            margin: 0 auto;
            min-height: auto;
            flex-wrap: wrap;
        }
        .form-container {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 32px;
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.14), 0 6px 22px rgba(0,0,0,0.08), 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(255,255,255,0.5), 0 0 60px rgba(255,255,255,0.3);
            min-width: 280px;
            max-width: 500px;
            width: 100%;
            flex: 0 1 460px;
            height: fit-content;
            margin: 0;
            transform: perspective(1000px) rotateX(0deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .form-container:hover {
            transform: perspective(1000px) rotateX(-5deg) translateY(-10px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15), 0 10px 25px rgba(0,0,0,0.1);
        }
        .result-container {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 36px;
            border-radius: 22px;
            min-width: 280px;
            max-width: 380px;
            width: 100%;
            flex: 0 1 360px;
            height: fit-content;
            display: none;
            margin: 0;
            align-self: center;
            transform: perspective(1000px) rotateX(0deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 18px 45px rgba(0,0,0,0.14), 0 6px 22px rgba(0,0,0,0.08), 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(255,255,255,0.5), 0 0 60px rgba(255,255,255,0.3);
        }
        .result-container.show {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: slideInRight 0.6s ease-out;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .result-container:hover {
            transform: perspective(1000px) rotateX(-5deg) translateY(-10px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15), 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,215,80,0.7);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 700;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            color: #555;
            position: relative;
            font-weight: bold;
        }
        input, select {
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(102,126,234,0.25);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.95);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.06);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        input:focus, select:focus {
            border-color: #4f62d6;
            outline: none;
            background: rgba(255,255,255,0.98);
            box-shadow: 0 0 18px rgba(102,126,234,0.4), inset 0 0 0 1px rgba(102,126,234,0.4);
            transform: scale(1.02);
        }
        input:hover, select:hover {
            border-color: rgba(102,126,234,0.8);
            box-shadow: inset 0 1px 8px rgba(102,126,234,0.12);
        }
        select {
            background-image: linear-gradient(45deg, transparent 50%, rgba(102,126,234,0.4) 50%), linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.9));
            background-position: calc(100% - 20px) center, 0 0;
            background-size: 12px 12px, 100% 100%;
            background-repeat: no-repeat;
            padding-right: 40px;
        }
        select::-ms-expand {
            display: none;
        }
        button {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }
        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102,126,234,0.6);
        }
        button:active {
            transform: translateY(0) scale(1);
        }
        .result-title {
            font-size: 24px;
            color: #764ba2;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
        .result-text {
            font-size: 20px;
            color: #111;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        .result-text span {
            display: block;
        }
        .result-value {
            color: #28a745;
            font-size: 22px;
            margin-top: 12px;
        }
        /* Form Sections */
        .form-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .form-section {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .form-section label {
            margin-bottom: 5px;
        }
        .form-section input,
        .form-section select {
            margin-bottom: 0;
            width: 100%;
            min-width: 0;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .footer {
            text-align: center;
            padding: 18px 20px;
            color: #f1f1f1;
            font-size: 14px;
            letter-spacing: 0.04em;
            background: rgba(0,0,0,0.28);
            backdrop-filter: blur(10px);
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        /* Responsive */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
                gap: 20px;
            }
            .form-container, .result-container {
                min-width: unset;
                max-width: unset;
                width: 100%;
                flex: 1 1 auto;
                padding: 30px;
            }
            .form-sections {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <img src="{{ url_for('static', filename='image1.png') }}" alt="Logo">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <img src="{{ url_for('static', filename='image1.png') }}" alt="Logo">
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="main-layout">
            <div class="form-container">
                <h1>IPL Match Prediction</h1>
                <form action="/predict" method="POST">
                    <div class="form-sections">
                        <div class="form-section">
                            <label for="team1">Team 1:</label>
                            <select id="team1" name="team1" required>
                                <option value="">Select Team 1</option>
                                <option>Chennai Super Kings</option>
                                <option>Delhi Capitals</option>
                                <option>Gujarat Titans</option>
                                <option>Kolkata Knight Riders</option>
                                <option>Lucknow Super Giants</option>
                                <option>Mumbai Indians</option>
                                <option>Punjab Kings</option>
                                <option>Rajasthan Royals</option>
                                <option>Royal Challengers Bengaluru</option>
                                <option>Sunrisers Hyderabad</option>
                            </select>
                        </div>

                        <div class="form-section">
                            <label for="team2">Team 2:</label>
                            <select id="team2" name="team2" required>
                                <option value="">Select Team 2</option>
                                <option>Chennai Super Kings</option>
                                <option>Delhi Capitals</option>
                                <option>Gujarat Titans</option>
                                <option>Kolkata Knight Riders</option>
                                <option>Lucknow Super Giants</option>
                                <option>Mumbai Indians</option>
                                <option>Punjab Kings</option>
                                <option>Rajasthan Royals</option>
                                <option>Royal Challengers Bengaluru</option>
                                <option>Sunrisers Hyderabad</option>
                            </select>
                        </div>

                        <div class="form-section">
                            <label for="toss_decision">Toss Decision:</label>
                            <select id="toss_decision" name="toss_decision" required>
                                <option value="">Select Toss Decision</option>
                                <option value="bat">Bat</option>
                                <option value="field">Field</option>
                            </select>
                        </div>

                        <div class="form-section">
                            <label for="toss_winner">Toss Winner:</label>
                            <select id="toss_winner" name="toss_winner" required>
                                <option value="">Select Toss Winner</option>
                                <option>Chennai Super Kings</option>
                                <option>Delhi Capitals</option>
                                <option>Gujarat Titans</option>
                                <option>Kolkata Knight Riders</option>
                                <option>Lucknow Super Giants</option>
                                <option>Mumbai Indians</option>
                                <option>Punjab Kings</option>
                                <option>Rajasthan Royals</option>
                                <option>Royal Challengers Bengaluru</option>
                                <option>Sunrisers Hyderabad</option>
                            </select>
                        </div>

                        <div class="form-section">
                            <label for="venue">Venue:</label>
                            <select id="venue" name="venue" required>
                                <option value="">Select Venue</option>
                                <option>Arun Jaitley Stadium</option>
                                <option>Barabati Stadium</option>
                                <option>Barsapara Cricket Stadium</option>
                                <option>Bharat Ratna Shri Atal Bihari Vajpayee Ekana Cricket Stadium</option>
                                <option>Brabourne Stadium</option>
                                <option>Buffalo Park</option>
                                <option>De Beers Diamond Oval</option>
                                <option>Dr DY Patil Sports Academy</option>
                                <option>Dr. Y.S. Rajasekhara Reddy ACA-VDCA Cricket Stadium</option>
                                <option>Dubai International Cricket Stadium</option>
                                <option>Eden Gardens</option>
                                <option>Feroz Shah Kotla</option>
                                <option>Green Park</option>
                                <option>Himachal Pradesh Cricket Association Stadium</option>
                                <option>Holkar Cricket Stadium</option>
                                <option>JSCA International Stadium Complex</option>
                                <option>Kingsmead</option>
                                <option>M Chinnaswamy Stadium</option>
                                <option>Maharaja Yadavindra Singh International Cricket Stadium</option>
                                <option>Maharashtra Cricket Association Stadium</option>
                                <option>MA Chidambaram Stadium</option>
                                <option>Narendra Modi Stadium</option>
                                <option>Nehru Stadium</option>
                                <option>New Wanderers Stadium</option>
                                <option>Newlands</option>
                                <option>OUTsurance Oval</option>
                                <option>Punjab Cricket Association IS Bindra Stadium</option>
                                <option>Punjab Cricket Association Stadium</option>
                                <option>Rajiv Gandhi International Stadium</option>
                                <option>Sardar Patel Stadium</option>
                                <option>Saurashtra Cricket Association Stadium</option>
                                <option>Sawai Mansingh Stadium</option>
                                <option>Shaheed Veer Narayan Singh International Stadium</option>
                                <option>Sharjah Cricket Stadium</option>
                                <option>Sheikh Zayed Stadium</option>
                                <option>St George's Park</option>
                                <option>Subrata Roy Sahara Stadium</option>
                                <option>SuperSport Park</option>
                                <option>Vidarbha Cricket Association Stadium</option>
                                <option>Wankhede Stadium</option>
                                <option>Zayed Cricket Stadium</option>
                            </select>
                        </div>

                        <div class="form-section">
                            <label for="city">City:</label>
                            <select id="city" name="city" required>
                                <option value="">Select City</option>
                                <option>Abu Dhabi</option>
                                <option>Ahmedabad</option>
                                <option>Bangalore</option>
                                <option>Bloemfontein</option>
                                <option>Cape Town</option>
                                <option>Centurion</option>
                                <option>Chandigarh</option>
                                <option>Chennai</option>
                                <option>Cuttack</option>
                                <option>Delhi</option>
                                <option>Dharamsala</option>
                                <option>Dubai</option>
                                <option>Durban</option>
                                <option>East London</option>
                                <option>Guwahati</option>
                                <option>Hyderabad</option>
                                <option>Indore</option>
                                <option>Jaipur</option>
                                <option>Johannesburg</option>
                                <option>Kanpur</option>
                                <option>Kimberley</option>
                                <option>Kochi</option>
                                <option>Kolkata</option>
                                <option>Lucknow</option>
                                <option>Mohali</option>
                                <option>Mumbai</option>
                                <option>Nagpur</option>
                                <option>Navi Mumbai</option>
                                <option>New Chandigarh</option>
                                <option>Port Elizabeth</option>
                                <option>Pune</option>
                                <option>Raipur</option>
                                <option>Rajkot</option>
                                <option>Ranchi</option>
                                <option>Sharjah</option>
                                <option>Visakhapatnam</option>
                            </select>
                        </div>

                        <button type="submit" class="full-width">Predict</button>
                    </div>
                </form>
            </div>
            {% if prediction_text and prediction_value %}
            <div class="result-container show">
                <div class="result-title">Prediction Result</div>
                <div class="result-text">
                    <span>{{ prediction_text }}</span>
                    <span class="result-value">{{ prediction_value }}</span>
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <footer class="footer">
        © 2026 Mayuresh AI Solutions. All rights reserved.
    </footer>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').style.display = 'none';
                document.querySelector('.navbar').style.display = 'block';
                document.querySelector('.main-content').style.display = 'block';
            }, 3000); // 3 seconds for loading
        });
    </script>
</body>
</html>
